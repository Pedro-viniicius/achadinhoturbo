<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · achadinhoturbo</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="theme-color" content="#5B3DF5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login">
<main class="login-caixa">
  <div class="brand"><img src="logo.svg" alt="" width="30" height="30">achadinho<span>turbo</span></div>
  <form id="f" class="card" novalidate>
    <h1>Entrar</h1>
    <p class="sub" id="sub">Seus achadinhos chegam primeiro.</p>
    <!-- No modo legado (Dono migrado ainda sem e-mail) login.js deixa o e-mail opcional: em branco, entra a conta sem e-mail. -->
    <label class="campo" id="campo-email"><span id="rotulo-email">E-mail</span><input id="email" name="email" type="email" autocomplete="username" maxlength="120" required autofocus aria-describedby="erro"><small id="dica-email" hidden></small></label>
    <label class="campo">Senha<input id="senha" name="senha" type="password" autocomplete="current-password" required aria-describedby="erro"></label>
    <p id="erro" class="login-erro" role="alert" hidden></p>
    <button class="pri" id="entrar" type="submit">Entrar</button>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>
