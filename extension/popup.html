<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  body { margin:0; width:320px; font:13px/1.45 system-ui, "Segoe UI", sans-serif; color:#16202A; background:#fff; }
  main { padding:16px; display:grid; gap:12px; }
  h1 { margin:0; font-size:15px; }
  .estado { display:flex; gap:8px; align-items:center; padding:10px 12px; border-radius:8px; background:#EDF0F3; }
  .estado i { width:9px; height:9px; border-radius:50%; background:#C73A2E; flex:none; }
  .estado.ok i { background:#1B8A4B; }
  label { display:grid; gap:4px; font-weight:600; }
  input { font:inherit; padding:8px 10px; border:1px solid #C9D1D9; border-radius:6px; }
  input:focus-visible, button:focus-visible { outline:2px solid #2740E6; outline-offset:1px; }
  button { font:inherit; font-weight:600; padding:9px 12px; border:0; border-radius:6px; background:#2740E6; color:#fff; cursor:pointer; }
  small { color:#5E6B78; }
</style></head>
<body><main>
  <h1>Disparador ML</h1>
  <div class="estado" id="estado"><i></i><span id="msg">Verificando…</span></div>
  <label>Endereço do Disparador<input id="servidor" value="http://127.0.0.1:3737"></label>
  <label>Token (copie em Ajustes, no painel)<input id="token" placeholder="cole aqui" autocomplete="off"></label>
  <button id="salvar">Salvar e conectar</button>
  <small id="erro"></small>
</main><script src="popup.js"></script></body></html>
